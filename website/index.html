    <script>
      (function () {
        var root = document.documentElement;
        var saved = null;
        try { saved = localStorage.getItem("htt.theme"); } catch (_) {}
        var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = dark ? "dark" : "light";
        root.dataset.themeSource = saved ? "manual" : "system";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0d0e0c" : "#f2f2ed");
      })();
    </script>

    <canvas class="thread-canvas" id="thread-canvas" aria-hidden="true"></canvas>
    <div id="app"></div>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
